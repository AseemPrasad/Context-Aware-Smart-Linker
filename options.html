<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CASL Enterprise Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 1.25rem;
      margin-bottom: 4px;
      color: #38bdf8;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.9rem;
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #0369a1;
    }
    .status-msg {
      margin-top: 12px;
      font-size: 0.85rem;
      text-align: center;
      color: #34d399;
      display: none;
    }
  </style>
</head>
<body>
  <h2>CASL Enterprise Due Diligence</h2>
  <p class="subtitle">Configure corporate gateway & tenant credentials</p>

  <div class="form-group">
    <label for="gatewayUrl">Gateway Ingress URL</label>
    <input type="text" id="gatewayUrl" placeholder="http://localhost:8000">
  </div>

  <div class="form-group">
    <label for="tenantId">Workspace / Tenant ID</label>
    <input type="text" id="tenantId" placeholder="default">
  </div>

  <div class="form-group">
    <label for="apiKey">Enterprise Bearer / API Key</label>
    <input type="password" id="apiKey" placeholder="casl_sec_... or JWT token">
  </div>

  <div class="form-group">
    <label for="groqKey">Personal Groq API Key (Optional Offline Fallback)</label>
    <input type="password" id="groqKey" placeholder="gsk_...">
  </div>

  <button id="saveBtn">Save Configuration</button>
  <div id="statusMsg" class="status-msg">Configuration saved successfully!</div>

  <script src="options.js"></script>
</body>
</html>
