<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.3">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Stylized Geometric Logo Emblem (The Concentric Lens & Citation Prism) -->
  <g transform="translate(100, 110)">
    <!-- Outer Focus Hexagon / Document Border -->
    <polygon points="90,10 170,55 170,145 90,190 10,145 10,55" fill="none" stroke="#334155" stroke-width="3" opacity="0.7"/>
    <!-- Outer Glow Hexagon -->
    <polygon points="90,20 160,60 160,140 90,180 20,140 20,60" fill="none" stroke="url(#cyanGlow)" stroke-width="3.5" filter="url(#glowFilter)"/>

    <!-- Inner Refraction Diamond (Context Lens) -->
    <polygon points="90,40 140,100 90,160 40,100" fill="none" stroke="url(#purpleGlow)" stroke-width="3"/>

    <!-- Core Center Prism Pill -->
    <circle cx="90" cy="100" r="16" fill="#0EA5E9" filter="url(#glowFilter)"/>
    <circle cx="90" cy="100" r="8" fill="#F8FAFC"/>

    <!-- Precision Telemetry Crosshairs -->
    <line x1="90" y1="0" x2="90" y2="200" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="0" y1="100" x2="180" y2="100" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  </g>

  <!-- Title & Typography -->
  <text x="320" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#F8FAFC" letter-spacing="-1.5">
    C A S L
  </text>
  <text x="560" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="28" fill="#94A3B8">
    | Context-Aware Smart Linker
  </text>

  <!-- Subtitle / Tagline -->
  <text x="320" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="22" fill="#38BDF8">
    Enterprise In-Situ Due Diligence &amp; Autonomous Regulatory RAG Platform
  </text>
  <text x="320" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94A3B8">
    Eliminating context switching for M&amp;A, private equity deal leads, and regulatory attorneys.
  </text>

  <!-- Live Telemetry / Feature Pills -->
  <g transform="translate(320, 270)">
    <!-- Pill 1: Endpoints -->
    <rect x="0" y="0" width="160" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#38BDF8"/>
    <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" fill="#F8FAFC">
      37 API Endpoints
    </text>

    <!-- Pill 2: Security -->
    <rect x="175" y="0" width="180" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="195" cy="19" r="5" fill="#34D399"/>
    <text x="209" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" fill="#F8FAFC">
      OIDC RS256 Verified
    </text>

    <!-- Pill 3: Tests -->
    <rect x="370" y="0" width="185" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="390" cy="19" r="5" fill="#A855F7"/>
    <text x="404" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" fill="#F8FAFC">
      16/16 Tests (0.06s)
    </text>

    <!-- Pill 4: Overlay -->
    <rect x="570" y="0" width="195" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="590" cy="19" r="5" fill="#F59E0B"/>
    <text x="604" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" fill="#F8FAFC">
      Chrome Manifest V3
    </text>
  </g>

  <!-- Decorative Signal Waves at Bottom Right -->
  <g transform="translate(1020, 290)" opacity="0.7">
    <path d="M 0 50 Q 30 10, 60 50 T 120 50" fill="none" stroke="url(#cyanGlow)" stroke-width="3"/>
    <path d="M 0 65 Q 30 25, 60 65 T 120 65" fill="none" stroke="url(#emeraldGlow)" stroke-width="2" opacity="0.6"/>
    <path d="M 0 80 Q 30 40, 60 80 T 120 80" fill="none" stroke="url(#purpleGlow)" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>

