<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="200" height="200" rx="40" fill="url(#logoBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Logo Focus Hexagon -->
  <polygon points="100,25 165,62 165,138 100,175 35,138 35,62" fill="none" stroke="url(#cyanGlow)" stroke-width="4.5" filter="url(#logoGlow)"/>

  <!-- Inner Prism Diamond -->
  <polygon points="100,50 142,100 100,150 58,100" fill="none" stroke="url(#purpleGlow)" stroke-width="3"/>

  <!-- Center Core Lens -->
  <circle cx="100" cy="100" r="16" fill="#0EA5E9" filter="url(#logoGlow)"/>
  <circle cx="100" cy="100" r="8" fill="#F8FAFC"/>

  <!-- Coordinate Crosshairs -->
  <line x1="100" y1="15" x2="100" y2="185" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="15" y1="100" x2="185" y2="100" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
</svg>

