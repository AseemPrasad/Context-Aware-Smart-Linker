version: '3.8'

services:
  casl-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casl-api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - TELEMETRY_ENABLED=false
      - AUTH_ENABLED=false
      - BILLING_ENABLED=true
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: casl-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: casl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casl-celery-worker
    command: celery -A backend.tasks.celery_app worker --loglevel=info -Q default,high_priority,batch_indexing
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: casl-celery-beat
    command: celery -A backend.tasks.celery_app beat --loglevel=info
    environment:
      - REDIS_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
  huggingface_cache:

